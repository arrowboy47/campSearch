{# Fixed bottom navigation. `body.page` gets padding-bottom so nothing hides
   behind it. #}
<nav class="bottom-nav" aria-label="Primary">
  <a href="/" class="bottom-nav-item{% if request.path == '/' %} is-active{% endif %}">
    <span class="bottom-nav-icon" aria-hidden="true">🏕️</span>
    <span class="bottom-nav-label">Home</span>
  </a>
  <a href="/nearby" class="bottom-nav-item{% if request.path == '/nearby' %} is-active{% endif %}">
    <span class="bottom-nav-icon" aria-hidden="true">📍</span>
    <span class="bottom-nav-label">Nearby</span>
  </a>
  <a href="/users" class="bottom-nav-item{% if request.path.startswith('/users') %} is-active{% endif %}">
    <span class="bottom-nav-icon" aria-hidden="true">👥</span>
    <span class="bottom-nav-label">Community</span>
  </a>
  <a href="/account" class="bottom-nav-item{% if request.path.startswith('/account') %} is-active{% endif %}">
    <span class="bottom-nav-icon" aria-hidden="true">★</span>
    <span class="bottom-nav-label">Saved</span>
  </a>
</nav>
