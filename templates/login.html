<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Sign in · Camp Search</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
	<script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body class="page">
	<header class="page-header">
		<div class="page-header-inner">
			<a href="/" class="brand">
				<div class="brand-mark">🏕️</div>
				<div class="brand-text">
					<div class="brand-title">Camp Search</div>
					<div class="brand-subtitle">Find open campsites with the right amenities</div>
				</div>
			</a>
			{% include "_headernav.html" %}
		</div>
	</header>

	<main class="page-main narrow-main">
		{% include "_flash.html" %}
		<h1>Sign in</h1>
		<form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" class="stack-form">
			{{ csrf_input() }}
			<label>Username<input type="text" name="username" required value="{{ username or '' }}" /></label>
			<label>Password<input type="password" name="password" required /></label>
			<button type="submit" class="btn btn-primary">Sign in</button>
		</form>
		<p><a href="/signup" class="link-quiet">No account? Create one</a></p>
	</main>

	<footer class="page-footer">
		<p class="page-footer-text">Accounts are optional — search works without one.</p>
	</footer>
	{% include "_bottomnav.html" %}
</body>
</html>
